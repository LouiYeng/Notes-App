<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notes App</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #fceabb, #f8b500);
      --card-bg: #fff;
      --text-color: #000;
      --button-bg: #ff9800;
      --button-hover: #e68900;
      --note-title: #ff9800;
    }

    body.dark-mode {
      --bg-gradient: linear-gradient(135deg, #2c3e50, #4ca1af);
      --card-bg: #2f2f2f;
      --text-color: #f0f0f0;
      --button-bg: #607d8b;
      --button-hover: #455a64;
      --note-title: #ffee58;
    }

    * {
      transition: background 0.4s ease, color 0.4s ease, border-color 0.4s ease;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      font-size: 3rem;
      color: #fff;
      margin-bottom: 10px;
      text-shadow: 2px 2px #00000033;
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .form-container {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 600px;
      margin-bottom: 20px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      background: #f1f1f1;
      font-size: 1rem;
    }

    button {
      background-color: var(--button-bg);
      color: white;
      font-weight: bold;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background-color: var(--button-hover);
    }

    .note {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      margin-top: 15px;
      position: relative;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .note strong {
      font-size: 1.2rem;
      color: var(--note-title);
    }

    .note-actions {
      position: absolute;
      top: 10px;
      right: 10px;
    }

    .note-actions button {
      background: #eee;
      color: #333;
      margin-left: 5px;
    }

    #notes-container {
      width: 100%;
      max-width: 600px;
    }

    .bulb-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.5rem;
      transition: transform 0.6s ease, color 0.6s ease;
      position: relative;
    }

    .bulb-btn::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 0;
      height: 0;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,0,0.4) 0%, transparent 70%);
      opacity: 0;
      transition: all 0.6s ease;
      z-index: -1;
    }

    .bulb-btn.active {
      transform: rotate(360deg);
      color: gold;
    }

    .bulb-btn.active::before {
      width: 100px;
      height: 100px;
      opacity: 1;
    }
  </style>
</head>
<body>
  <h1>📝 Notes App</h1>
  <div class="controls">
    <input type="text" id="search-input" placeholder="🔍 Search notes..." oninput="filterNotes()">
    <button class="bulb-btn" id="theme-toggle" onclick="toggleDarkMode()">💡</button>
    <button onclick="undoNote()">↩️ Undo</button>
    <button onclick="redoNote()">↪️ Redo</button>
  </div>
  <div class="form-container">
    <input type="text" id="note-title" placeholder="Title">
    <textarea id="note-content" placeholder="Write your note here..."></textarea>
    <button onclick="addNote()">➕ Add Note</button>
  </div>
  <div id="notes-container"></div>

  <script>
    let notes = [];
    let history = [];
    let redoStack = [];

    function saveState() {
      history.push(JSON.stringify(notes));
      if (history.length > 100) history.shift();
    }

    function undoNote() {
      if (history.length > 0) {
        redoStack.push(JSON.stringify(notes));
        notes = JSON.parse(history.pop());
        displayNotes();
      } else {
        alert("Nothing to undo.");
      }
    }

    function redoNote() {
      if (redoStack.length > 0) {
        history.push(JSON.stringify(notes));
        notes = JSON.parse(redoStack.pop());
        displayNotes();
      } else {
        alert("Nothing to redo.");
      }
    }

    function addNote() {
      const title = document.getElementById('note-title').value.trim();
      const content = document.getElementById('note-content').value.trim();
      if (!title || !content) {
        alert("Please enter both a title and content.");
        return;
      }
      saveState();
      redoStack = [];

      const note = { title, content, id: Date.now() };
      notes.unshift(note);
      displayNotes();

      document.getElementById('note-title').value = '';
      document.getElementById('note-content').value = '';
    }

    function displayNotes(filtered = notes) {
      const container = document.getElementById('notes-container');
      container.innerHTML = '';
      filtered.forEach(note => {
        const noteEl = document.createElement('div');
        noteEl.className = 'note';
        noteEl.innerHTML = `
          <strong>${note.title}</strong>
          <p>${note.content}</p>
          <div class="note-actions">
            <button onclick="downloadNote('${note.title}', \`${note.content}\`)">⬇</button>
            <button onclick="deleteNote(${note.id})">🗑</button>
          </div>
        `;
        container.appendChild(noteEl);
      });
    }

    function deleteNote(id) {
      saveState();
      redoStack = [];
      notes = notes.filter(note => note.id !== id);
      displayNotes();
    }

    function downloadNote(title, content) {
      const blob = new Blob([content], { type: 'text/plain' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${title}.txt`;
      link.click();
    }

    function filterNotes() {
      const search = document.getElementById('search-input').value.toLowerCase();
      const filtered = notes.filter(note =>
        note.title.toLowerCase().includes(search) ||
        note.content.toLowerCase().includes(search)
      );
      displayNotes(filtered);
    }

    function toggleDarkMode() {
      const bulb = document.getElementById('theme-toggle');
      document.body.classList.toggle('dark-mode');
      bulb.classList.toggle('active');
    }
  </script>
</body>
</html>
